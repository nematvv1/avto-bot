services:
  - type: web
    name: channel-bot
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    disk:
      name: channel-bot-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: TEXT_MODEL
        value: gpt-5.5
      - key: IMAGE_MODEL
        value: gpt-image-2
      - key: DB_PATH
        value: /var/data/bot_database.db
      - key: IMAGES_DIR
        value: /var/data/generated_images
      - key: IMAGE_STYLE
        sync: false
      - key: IMAGE_SIZE
        value: 1536x1024
      - key: ADD_BRANDING
        value: "true"
      # --- Kanal(lar)/brend(lar): TARGETS + har bir kalit uchun TARGET_<KALIT>_* ---
      # (bitta kanal yetarli bo'lsa, TARGETS'ni bo'sh qoldirib CHANNEL_ID/CHANNEL_TOPIC/
      # BRAND_NAME/LOGO_PATH/BRAND_ACCENT_COLOR/POST_CONTACT_FOOTER'ni ishlating)
      - key: TARGETS
        sync: false
      - key: TARGET_ACADEMY_LABEL
        sync: false
      - key: TARGET_ACADEMY_CHANNEL_ID
        sync: false
      - key: TARGET_ACADEMY_TOPIC
        sync: false
      - key: TARGET_ACADEMY_BRAND_NAME
        sync: false
      - key: TARGET_ACADEMY_LOGO_PATH
        value: assets/logo.png
      - key: TARGET_ACADEMY_ACCENT_COLOR
        value: "#2033E9"
      - key: TARGET_ACADEMY_CONTACT_FOOTER
        sync: false
      - key: TARGET_SCHOOL_LABEL
        sync: false
      - key: TARGET_SCHOOL_CHANNEL_ID
        sync: false
      - key: TARGET_SCHOOL_TOPIC
        sync: false
      - key: TARGET_SCHOOL_BRAND_NAME
        sync: false
      - key: TARGET_SCHOOL_LOGO_PATH
        value: assets/logo.png
      - key: TARGET_SCHOOL_ACCENT_COLOR
        value: "#2033E9"
      - key: TARGET_SCHOOL_CONTACT_FOOTER
        sync: false
      - key: TIMEZONE
        value: Asia/Tashkent
      - key: POLL_ALLOWS_MULTIPLE
        value: "false"
      - key: IMAGE_CLEANUP_DAYS
        value: "7"
      - key: SCHEDULE_MAX_RETRIES
        value: "5"
      - key: SCHEDULE_RETRY_BASE_MINUTES
        value: "2"
      - key: SCHEDULE_RETRY_MAX_MINUTES
        value: "60"
      - key: MAX_GENERATIONS_PER_HOUR
        value: "20"
      - key: SCHEDULED_PAGE_SIZE
        value: "8"
